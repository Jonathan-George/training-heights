name: Production Availability Monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  availability:
    name: Check production availability
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test production website
        id: monitor
        continue-on-error: true
        env:
          SITE_URL: https://jonathan-george.github.io/training-night-pages/
          EXPECTED_TEXT: Containerize the app
        run: |
          response_file="$(mktemp)"

          status_code="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --retry 3 \
              --retry-delay 5 \
              --max-time 30 \
              "$SITE_URL"
          )"

          echo "HTTP status: $status_code"

          if [ "$status_code" != "200" ]; then
            echo "Production returned HTTP $status_code"
            exit 1
          fi

          if ! grep --fixed-strings --quiet "$EXPECTED_TEXT" "$response_file"; then
            echo "Expected production content was missing"
            exit 1
          fi

          echo "Production availability check passed"

      - name: Open production incident
        if: steps.monitor.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing_issue="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state open \
              --search '"Production availability incident" in:title' \
              --json number \
              --jq '.[0].number'
          )"

          if [ -z "$existing_issue" ]; then
            gh issue create \
              --repo "$REPOSITORY" \
              --title "Production availability incident" \
              --label "production-incident" \
              --body "The automated production monitor failed. Investigate the workflow run: $RUN_URL"
          else
            gh issue comment "$existing_issue" \
              --repo "$REPOSITORY" \
              --body "Production monitoring failed again. Workflow run: $RUN_URL"
          fi

      - name: Close recovered incident
        if: steps.monitor.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          existing_issue="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state open \
              --search '"Production availability incident" in:title' \
              --json number \
              --jq '.[0].number'
          )"

          if [ -n "$existing_issue" ]; then
            gh issue close "$existing_issue" \
              --repo "$REPOSITORY" \
              --comment "Production has recovered. The automated availability check passed."
          fi

      - name: Create monitoring summary
        if: always()
        run: |
          {
            echo "## Production monitoring result"
            echo ""
            echo "- Website: https://jonathan-george.github.io/training-night-pages/"
            echo "- Checked at: $(date --utc --iso-8601=seconds)"
            echo "- Monitor result: ${{ steps.monitor.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow when production is unavailable
        if: steps.monitor.outcome == 'failure'
        run: |
          echo "::error::Production monitoring failed and an incident was created"
          exit 1