name: Controlled Versioned Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, for example v1.0.0"
        required: true
        type: string
      release_notes:
        description: "Describe the changes included in this release"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    name: Validate, package and release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ensure release runs from main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Releases must be created from the protected main branch"
            exit 1
          fi

      - name: Check out exact release commit
        uses: actions/checkout@v4

      - name: Validate semantic version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" |
            grep --extended-regexp --quiet '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must follow the format v1.2.3"
            exit 1
          fi

          echo "Validated release version: $VERSION"

      - name: Prevent duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists"
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Git tag $VERSION already exists"
            exit 1
          fi

      - name: Validate website before packaging
        run: python scripts/validate_site.py

      - name: Package production website
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PACKAGE="training-night-pages-${VERSION}.zip"

          zip "$PACKAGE" \
            index.html \
            .nojekyll \
            README.md \
            SECURITY.md

          sha256sum "$PACKAGE" > "${PACKAGE}.sha256"

          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Attest release package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.PACKAGE }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          gh release create "$VERSION" \
            "$PACKAGE" \
            "${PACKAGE}.sha256" \
            --target "${{ github.sha }}" \
            --title "Training Night ${VERSION}" \
            --notes "$RELEASE_NOTES"

      - name: Write release summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Controlled release completed"
            echo ""
            echo "- Version: $VERSION"
            echo "- Commit: ${{ github.sha }}"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Package: $PACKAGE"
            echo "- Integrity checksum: ${PACKAGE}.sha256"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"